<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ClutchBoard Setup</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body data-state="installing">
        <header data-tauri-drag-region>
            <button id="close" type="button" aria-label="Close">
                <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" /></svg>
            </button>
        </header>
        <main data-tauri-drag-region>
            <img src="wordmark.svg" alt="ClutchBoard" class="wordmark" data-tauri-drag-region />
            <p id="status" role="status" aria-live="polite"></p>
            <div class="bar" aria-hidden="true"><span></span></div>
            <p id="error" role="alert"></p>
            <div class="actions">
                <button id="retry" type="button"></button>
            </div>
        </main>
        <footer id="version" data-tauri-drag-region></footer>
        <script src="main.js"></script>
    </body>
</html>
